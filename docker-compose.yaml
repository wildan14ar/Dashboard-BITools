services:
  redis:
    image: redis:7-alpine
    container_name: fyc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - bi-network

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: fyc-engine
    ports:
      - "50051:50051"
    environment:
      - REDIS_URL=redis://redis:6379
      - QUERY_CACHE_TTL_SEC=300
      - GRPC_PORT=50051
    volumes:
      - ./proto:/app/proto:ro
    restart: unless-stopped
    networks:
      - bi-network

  postgres:
    image: postgres:15-alpine
    container_name: fyc-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fycuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fycpassword}
      - POSTGRES_DB=${POSTGRES_DB:-fycdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - bi-network

  dashboard:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: fyc-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fycuser}:${POSTGRES_PASSWORD:-fycpassword}@postgres:5432/${POSTGRES_DB:-fycdb}
      - AUTH_SECRET=${DASHBOARD_AUTH_SECRET:-your_secret_key}
      - QUERY_ENGINE_HOST=query-engine:50051
    depends_on:
      - engine
    restart: unless-stopped
    networks:
      - bi-network

volumes:
  redis_data:
  postgres_data:

networks:
  bi-network:
    driver: bridge
