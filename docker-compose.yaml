services:
  redis:
    image: redis:7-alpine
    container_name: fyc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - bi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: fyc-engine
    ports:
      - "50051:50051"
    environment:
      - REDIS_URL=redis://redis:6379
      - QUERY_CACHE_TTL_SEC=300
      - GRPC_PORT=50051
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
    volumes:
      - ./proto:/app/proto:ro
    restart: unless-stopped
    networks:
      - bi-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket;socket.create_connection((\"127.0.0.1\",50051),timeout=5)'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:15-alpine
    container_name: fyc-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fycuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fycpassword}
      - POSTGRES_DB=${POSTGRES_DB:-fycdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - bi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fycuser}"]
      interval: 10s
      timeout: 3s
      retries: 3

  dashboard:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: fyc-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fycuser}:${POSTGRES_PASSWORD:-fycpassword}@postgres:5432/${POSTGRES_DB:-fycdb}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-${DASHBOARD_AUTH_SECRET:-your_secret_key}}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - QUERY_ENGINE_HOST=engine:50051
      - REDIS_URL=redis://redis:6379
    depends_on:
      engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bi-network
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://127.0.0.1:3000/api/health\").then(r=>{if(!r.ok)process.exit(1)})'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
  postgres_data:

networks:
  bi-network:
    driver: bridge
