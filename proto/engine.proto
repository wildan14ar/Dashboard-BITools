syntax = "proto3";

package engine;

service QueryEngine {
  rpc TestConnection(TestRequest) returns (TestResponse);
  rpc GetSchema(SchemaRequest) returns (SchemaResponse);
  rpc Execute(QueryRequest) returns (QueryResponse);
  rpc ExecuteStream(QueryRequest) returns (stream RowBatch);
  rpc InvalidateCache(CacheRequest) returns (CacheResponse);
}

message TestRequest {
  string source_id = 1;
  string db_type = 2;
  string config_json = 3;
}

message TestResponse {
  bool ok = 1;
  string error = 2;
}

message SchemaRequest {
  string source_id = 1;
  string db_type = 2;
  string config_json = 3;
}

message SchemaResponse {
  repeated TableInfo tables = 1;
}

message TableInfo {
  string name = 1;
  string schema = 2;
  repeated ColumnInfo columns = 3;
}

message ColumnInfo {
  string name = 1;
  string type = 2;
  bool nullable = 3;
  bool is_primary_key = 4;
  ForeignKey foreign_key = 5;
}

message ForeignKey {
  string table = 1;
  string column = 2;
}

message QueryRequest {
  string source_id = 1;
  string sql = 2;
  int32 max_rows = 3;
  int32 timeout_sec = 4;
  map<string, string> params = 5;
  string db_type = 6;
  string config_json = 7;
  bool use_cache = 8;
}

message QueryResponse {
  repeated string columns = 1;
  repeated Row rows = 2;
  int32 row_count = 3;
  double execution_time_ms = 4;
  bool cached = 5;
}

message Row {
  repeated string values = 1;
}

message RowBatch {
  repeated string columns = 1;
  repeated Row rows = 2;
  bool is_last = 3;
}

message CacheRequest {
  string source_id = 1;
}

message CacheResponse {
  bool ok = 1;
}
