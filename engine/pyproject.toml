[project]
name = "fyc-query-engine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.68",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "pymssql>=2.3",
    "pymongo>=4.10",
    "clickhouse-sqlalchemy>=0.3",
    "sqlalchemy-bigquery>=1.11",
    "redis>=5.2",
    "sqlparse>=0.5",
    "python-dotenv>=1.0",
    "protobuf>=5.29",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.68",
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
exclude = ["generated"]

[tool.ruff.lint]
# BLE001: catching Exception around Redis/DB calls is intentional (cache/engine must survive Redis down)
ignore = ["BLE001"]
